# Espace de travail à trois membres, qui reproduit la séparation qui faisait
# déjà la valeur de la version Electron : le cœur ne connaît pas l'interface.
#
#   trace-core  — lecture des journaux, tarification, carbone, agrégation.
#                 Aucune dépendance à Tauri ni à une quelconque interface :
#                 c'est ce qui permet de l'éprouver sur les trois systèmes
#                 sans rien installer, et au CLI d'exister gratuitement.
#   trace-cli   — le même chiffre, dans le terminal.
#   trace-app   — la barre d'état, le popover, le tableau de bord.
[workspace]
resolver = "2"
members = ["crates/trace-core", "crates/trace-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Guillaume Demergès"]

[workspace.dependencies]
trace-core = { path = "crates/trace-core" }
serde = { version = "1", features = ["derive"] }
# `preserve_order` : les objets JSON gardent leur ordre d'insertion plutôt que
# d'être triés alphabétiquement. La sortie `--json` se lit au terminal, et
# « generatedAt, days, from… » est un ordre de lecture, pas un hasard.
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
dirs = "5"
# Client HTTP bloquant, TLS pur Rust. `reqwest` embarquerait tokio pour trois
# requêtes par quart d'heure — tout un ordonnanceur asynchrone dans un binaire
# qu'on a justement choisi Tauri pour garder petit.
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }

# Le binaire est distribué : on optimise pour la taille autant que pour la
# vitesse. Le travail réel est de la lecture de fichiers, pas du calcul.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
