[package]
name = "trace-core"
description = "Cœur de TRACE : journaux, tarification, empreinte carbone, agrégation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
regex.workspace = true
dirs.workspace = true
ureq.workspace = true

# Uniquement pour `kill(pid, 0)` : vérifier qu'un processus existe sans le
# tuer. La bibliothèque standard n'expose pas d'équivalent.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Uniquement pour savoir si un processus est vivant. Interroger `tasklist` à
# chaque cycle serait à la fois faux et coûteux.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
