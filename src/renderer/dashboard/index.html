<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>TRACE — Tableau de bord</title>
<link rel="stylesheet" href="../shared/theme.css" />
<style>
  body { overflow-y: scroll; }
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px;
    padding: 10px 22px; height: 46px;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: saturate(160%) blur(14px);
    border-bottom: 1px solid var(--rule-soft);
    -webkit-app-region: drag;
  }
  .topbar > * { -webkit-app-region: no-drag; }
  .topbar .wordmark { font-size: 11.5px; font-weight: 700; letter-spacing: 0.22em; padding-left: 62px; }
  .spacer { margin-left: auto; }

  .seg { display: flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; }
  .seg button { padding: 4px 10px; font-size: 11px; border-right: 1px solid var(--rule); color: var(--ink-dim); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--panel-hi); color: var(--ink); font-weight: 600; }

  .icon-btn { width: 27px; height: 27px; border: 1px solid var(--rule); border-radius: 5px; display: grid; place-items: center; font-size: 13px; }
  .icon-btn:hover { background: var(--panel-hi); }

  /* Le héros : la bande d'enregistrement traverse toute la largeur, sans
     carte ni marge. C'est le papier qui défile sous le stylet. */
  .hero { border-bottom: 1px solid var(--rule-soft); overflow-anchor: none; }
  .hero-strip { height: 104px; overflow: hidden; }
  .hero-figures { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--rule-soft); }
  .fig { padding: 14px 22px 16px; border-right: 1px solid var(--rule-soft); }
  .fig:last-child { border-right: 0; }
  .fig .v { font-size: 25px; font-weight: 600; letter-spacing: -0.02em; margin: 5px 0 2px; }
  .fig .x { font-size: 11px; }
  .trend { font-size: 11px; font-weight: 600; }

  main {
    padding: 20px 22px 40px; display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr);
    /* Les graphes se dessinent en `requestAnimationFrame` : sans cela,
       l'ancrage de défilement de Chromium fait sauter la vue au moment où la
       hauteur des cartes se fige, et la page s'ouvre au milieu. */
    overflow-anchor: none;
  }
  /* `.card` pose la valeur par défaut sans sélecteur d'élément : sinon
     `section.card` (0,1,1) l'emporterait sur `.span-5` (0,1,0) et toute la
     grille retomberait en pleine largeur. */
  .card { grid-column: span 12; padding: 15px 16px 16px; }
  .card > h2 { font-size: 10px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase;
               color: var(--ink-faint); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .card > h2 .aside { margin-left: auto; font-weight: 500; letter-spacing: 0.04em; text-transform: none; font-size: 10.5px; }
  .card-controls { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  /* La carte devient une colonne flex pour que son graphe prenne la place
     restante quand la grille l'étire à la hauteur de sa voisine. */
  .card.chart { display: flex; flex-direction: column; }
  .chart-host { flex: 1; min-height: 132px; }
  .chart-axis { display: flex; justify-content: space-between; font-size: 9.5px; margin-top: 6px; }
  .card.span-6 { grid-column: span 6; } .card.span-7 { grid-column: span 7; }
  .card.span-5 { grid-column: span 5; } .card.span-4 { grid-column: span 4; } .card.span-8 { grid-column: span 8; }
  @media (max-width: 980px) {
    .card.span-6, .card.span-7, .card.span-5, .card.span-4, .card.span-8 { grid-column: span 12; }
    .hero-figures { grid-template-columns: repeat(2, 1fr); }
    .fig:nth-child(2) { border-right: 0; }
  }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { font-size: 9.5px; font-weight: 600; letter-spacing: 0.11em; text-transform: uppercase; color: var(--ink-faint);
       text-align: right; padding: 0 0 7px; border-bottom: 1px solid var(--rule-soft); }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 7px 0; border-bottom: 1px solid var(--rule-soft); text-align: right; }
  tr:last-child td { border-bottom: 0; }
  .name-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .mark { flex: none; }
  /* Les logos sont peints à travers un masque : la silhouette vient du
     fichier, la couleur suit le thème. */
  .mark.logo { display: inline-block; -webkit-mask-size: contain; mask-size: contain;
               -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
               -webkit-mask-position: center; mask-position: center; }
  .name-cell span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .gauges { display: grid; gap: 18px; }

  /* Un bloc par produit : la marque et le nom n'apparaissent qu'une fois. */
  .block-head { display: flex; align-items: center; gap: 8px; padding-bottom: 7px;
                margin-bottom: 10px; border-bottom: 1px solid var(--rule-soft); }
  .block-head .pname { font-size: 12.5px; font-weight: 600; }
  .block-head .origin { margin-left: auto; font-size: 10.5px; }

  .win { margin-bottom: 12px; }
  .win:last-child { margin-bottom: 0; }
  .win-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .win-top .wname { font-size: 9.5px; font-weight: 600; letter-spacing: 0.11em;
                    text-transform: uppercase; color: var(--ink-dim); }
  .win-top .val { margin-left: auto; font-size: 14.5px; font-weight: 600; }
  .win-meta { display: flex; gap: 8px; margin-top: 5px; font-size: 10.5px; }
  .win-meta .right { margin-left: auto; }
  .win .calib { font-size: 10px; padding: 0 5px; border-radius: 3px; color: var(--ink-faint);
                border: 1px solid transparent; text-decoration: underline; text-underline-offset: 2px;
                text-decoration-color: var(--rule); }
  .win .calib:hover { color: var(--ink); text-decoration-color: currentColor; }
  .calib-form { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 9px;
                padding: 9px 10px; background: var(--panel-hi); border-radius: 5px; font-size: 11px; }
  .calib-form > span:first-child { flex-basis: 100%; }
  .calib-input { display: flex; align-items: center; gap: 4px; }
  .calib-form input { width: 62px; padding: 3px 6px; }
  .calib-form .btn { padding: 3px 9px; font-size: 11px; }
  .calib-msg { flex-basis: 100%; font-size: 10.5px; }

  .equivs { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 9px; margin-top: 13px; }
  .equiv { background: var(--panel-hi); border-radius: 5px; padding: 9px 10px; }
  .equiv .n { font-size: 14px; font-weight: 600; margin-top: 3px; }
  .equiv .l { font-size: 10px; line-height: 1.3; }

  .note { font-size: 11px; color: var(--ink-dim); line-height: 1.5; }
  .note code { font-family: var(--font-mono); font-size: 10.5px; background: var(--panel-hi); padding: 1px 4px; border-radius: 3px; }

  .src { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--rule-soft); font-size: 12px; }
  .src:last-child { border-bottom: 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .src .info { flex: 1; min-width: 0; }
  .src .sub { font-size: 10.5px; color: var(--ink-faint); }
  .src .count { font-size: 11px; }

  dialog { border: 1px solid var(--rule); border-radius: 9px; background: var(--panel); color: var(--ink);
           padding: 0; width: min(520px, 92vw); box-shadow: 0 24px 60px rgba(0,0,0,.42); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dlg-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--rule-soft); }
  .dlg-head h2 { font-size: 13px; margin: 0; font-weight: 600; }
  .dlg-body { padding: 6px 18px 18px; max-height: 66vh; overflow-y: auto; }
  .field { padding: 13px 0; border-bottom: 1px solid var(--rule-soft); }
  .field:last-child { border-bottom: 0; }
  .field label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 3px; }
  .field .help { font-size: 10.5px; color: var(--ink-faint); margin-bottom: 7px; line-height: 1.45; }
  input[type=text], input[type=password], select, input[type=number] {
    width: 100%; padding: 6px 9px; font-family: var(--font-mono); font-size: 11.5px;
    background: var(--ground); color: var(--ink); border: 1px solid var(--rule); border-radius: 5px;
  }
  .row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .switch { display: flex; align-items: center; gap: 9px; }
  .btn { padding: 6px 12px; border: 1px solid var(--rule); border-radius: 5px; font-size: 11.5px; }
  .btn:hover { background: var(--panel-hi); }
  .btn.primary { background: var(--tokens-soft); border-color: transparent; color: var(--tokens); font-weight: 600; }
  .msg { font-size: 11px; margin-top: 7px; }

  .empty-state { grid-column: span 12; text-align: center; padding: 70px 20px; }
  .empty-state h2 { font-size: 15px; margin: 0 0 7px; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="wordmark">TRACE</span>
    <div class="seg" id="range-seg" role="group" aria-label="Période">
      <button data-days="1">24 h</button><button data-days="7">7 j</button>
      <button data-days="30">30 j</button><button data-days="90">90 j</button>
      <button data-days="365">1 an</button><button data-days="all">Tout</button>
    </div>
    <span class="legend" id="horizon"></span>
    <span class="spacer"></span>
    <span class="legend" id="updated"></span>
    <button class="icon-btn" id="refresh" title="Actualiser">⟳</button>
    <button class="icon-btn" id="export" title="Exporter en CSV">↓</button>
    <button class="icon-btn" id="settings-btn" title="Réglages">⚙</button>
  </div>

  <div class="hero">
    <div class="hero-strip" id="hero-strip"></div>
    <div class="hero-figures" id="figures"></div>
  </div>

  <main id="main"></main>

  <dialog id="settings">
    <div class="dlg-head"><h2>Réglages</h2><span class="spacer"></span>
      <button class="btn" id="close-settings">Fermer</button></div>
    <div class="dlg-body" id="settings-body"></div>
  </dialog>

  <script type="module" src="./dashboard.js"></script>
</body>
</html>
